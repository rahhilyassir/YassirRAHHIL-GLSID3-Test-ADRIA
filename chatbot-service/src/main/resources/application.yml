server:
  port: 8084

spring:
  application:
    name: chatbot-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8889}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
    mcp:
      client:
        enabled: false
      server:
        enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
