server:
  port: 8084

spring:
  application:
    name: chatbot-service
  config:
    import: optional:configserver:http://localhost:8888
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
    mcp:
      client:
        enabled: false
        toolcallback:
          enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
