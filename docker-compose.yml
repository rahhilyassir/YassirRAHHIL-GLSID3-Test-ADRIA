services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: bank-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/kafka/9092' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  config-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: config-service
        PORT: "8889"
    container_name: bank-config
    restart: unless-stopped
    environment:
      SERVER_PORT: "8889"
      SPRING_PROFILES_ACTIVE: native
    ports:
      - "8889:8889"
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8889/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  discovery-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: discovery-service
        PORT: "8761"
    container_name: bank-discovery
    restart: unless-stopped
    depends_on:
      config-service:
        condition: service_healthy
    environment:
      SERVER_PORT: "8761"
      CONFIG_SERVER_URL: http://config-service:8889
      EUREKA_URL: http://discovery-service:8761/eureka
      EUREKA_HOSTNAME: discovery-service
    ports:
      - "8761:8761"
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 25s

  account-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: account-service
        PORT: "8081"
    container_name: bank-account
    restart: unless-stopped
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      SERVER_PORT: "8081"
      CONFIG_SERVER_URL: http://config-service:8889
      EUREKA_URL: http://discovery-service:8761/eureka
    networks:
      - bank-network

  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: transaction-service
        PORT: "8082"
    container_name: bank-transaction
    restart: unless-stopped
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: "8082"
      CONFIG_SERVER_URL: http://config-service:8889
      EUREKA_URL: http://discovery-service:8761/eureka
      KAFKA_BOOTSTRAP: kafka:9092
    networks:
      - bank-network

  event-consumer-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: event-consumer-service
        PORT: "8083"
    container_name: bank-event-consumer
    restart: unless-stopped
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: "8083"
      CONFIG_SERVER_URL: http://config-service:8889
      EUREKA_URL: http://discovery-service:8761/eureka
      KAFKA_BOOTSTRAP: kafka:9092
    networks:
      - bank-network

  chatbot-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: chatbot-service
        PORT: "8084"
    container_name: bank-chatbot
    restart: unless-stopped
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SERVER_PORT: "8084"
      CONFIG_SERVER_URL: http://config-service:8889
      EUREKA_URL: http://discovery-service:8761/eureka
      ACCOUNT_MCP_URL: http://account-service:8081
      TRANSACTION_MCP_URL: http://transaction-service:8082
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo-key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8084:8084"
    networks:
      - bank-network

  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gateway-service
        PORT: "8080"
    container_name: bank-gateway
    restart: unless-stopped
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started
      chatbot-service:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      CONFIG_SERVER_URL: http://config-service:8889
      EUREKA_URL: http://discovery-service:8761/eureka
    ports:
      - "8080:8080"
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bank-frontend
    restart: unless-stopped
    depends_on:
      gateway-service:
        condition: service_healthy
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "4200:4200"
    stdin_open: true
    tty: true
    networks:
      - bank-network

networks:
  bank-network:
    driver: bridge

volumes:
  kafka-data:
