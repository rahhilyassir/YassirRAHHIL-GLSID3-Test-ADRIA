<section class="card">
  <h2>Accounts</h2>
  <div class="grid">
    <div>
      <form class="form-grid" (ngSubmit)="submit()">
        <label>
          Customer ID
          <input [(ngModel)]="form.customerId" name="customerId" required />
        </label>

        <label>
          Currency
          <select [(ngModel)]="form.currency" name="currency">
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
            <option value="MAD">MAD</option>
          </select>
        </label>

        <label>
          Initial balance
          <input type="number" step="0.01" [(ngModel)]="form.balance" name="balance" />
        </label>

        <button type="submit">Create account</button>
      </form>

      <div *ngIf="successMessage" class="success">{{ successMessage }}</div>
      <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
    </div>

    <div>
      <h3>Account list</h3>
      <ul class="list" *ngIf="accounts.length; else empty">
        <li *ngFor="let account of accounts">
          <strong>#{{ account.id }}</strong> — {{ account.customerId }}<br />
          <small>{{ account.currency }} · {{ account.balance ?? 0 }}</small><br />
          <span class="status">{{ account.status ?? 'ACTIVE' }}</span>
        </li>
      </ul>
      <ng-template #empty>
        <p>No accounts yet.</p>
      </ng-template>
    </div>
  </div>
</section>
